{{- include "larixy.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: larixy-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "larixy.labels" (dict "root" . "name" "larixy-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := omit (include "larixy.secretData" . | fromJson) "LARIXY_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: larixy-unfurl-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "larixy.labels" (dict "root" . "name" "larixy-unfurl-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with get (include "larixy.secretData" . | fromJson) "LARIXY_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
data:
  LARIXY_ACTIVITYPUB_SIGNING_KEY_BASE64: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
