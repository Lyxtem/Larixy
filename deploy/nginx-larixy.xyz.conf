# Nginx reverse proxy configuration for Larixy (larixy.xyz)
# Place in /etc/nginx/sites-available/larixy.xyz on your VPS
# and enable with: ln -s /etc/nginx/sites-available/larixy.xyz /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name larixy.xyz www.larixy.xyz;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering & timeouts for streaming/voice
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
