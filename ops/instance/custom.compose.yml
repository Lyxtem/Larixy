services:
  edge:
    volumes:
      - /home/deploy/apps/wave-instance/extra/landing:/srv/landing:ro
  admin:
    image: ghcr.io/lyxtem/larixy-admin:2026.1123.212843
    environment:
      LARIXY_ADMIN_BASE_PATH: /admin
      LARIXY_ADMIN_ENDPOINT: https://larixy.xyz/admin
      LARIXY_ADMIN_PORT: "8080"
      LARIXY_ADMIN_OAUTH_CLIENT_SECRET: ${FLUXER_ADMIN_OAUTH_CLIENT_SECRET:-}
      LARIXY_ADMIN_SECRET_KEY_BASE: ${FLUXER_ADMIN_SECRET_KEY_BASE:-}
      LARIXY_ADMIN_SSO_CLIENT_SECRET: ${FLUXER_ADMIN_SSO_CLIENT_SECRET:-}
      LARIXY_API_ENDPOINT: http://api:8080
      LARIXY_APP_ENDPOINT: https://larixy.xyz
      LARIXY_MEDIA_ENDPOINT: https://larixy.xyz/media
      LARIXY_STATIC_CDN_ENDPOINT: https://larixy.xyz
      LARIXY_BASE_DOMAIN: larixy.xyz
      LARIXY_PUBLIC_ORIGIN: https://larixy.xyz
      LARIXY_PUBLIC_PORT: "443"
      LARIXY_SELF_HOSTED: "true"
      LARIXY_TRUST_CLIENT_IP_HEADER: "true"
  api:
    environment:
      FLUXER_APP_PRODUCT_NAME: "Larixy"
      LARIXY_KLIPY_API_KEY: ${FLUXER_KLIPY_API_KEY:-}
    volumes:
      - /home/deploy/apps/wave-instance/extra/chunk-ZKNE52GF.js:/usr/src/app/fluxer_api/dist/chunk-ZKNE52GF.js:ro
      - /home/deploy/apps/wave-instance/extra/chunk-T4R7PYWV.js:/usr/src/app/fluxer_api/dist/chunk-T4R7PYWV.js:ro
      - /home/deploy/apps/wave-instance/extra/chunk-ZXO4TNSM.js:/usr/src/app/fluxer_api/dist/chunk-ZXO4TNSM.js:ro
      - /home/deploy/apps/wave-instance/extra/AppEntrypoint.js:/usr/src/app/fluxer_api/dist/AppEntrypoint.js:ro
  static-proxy:
    volumes:
      - /home/deploy/apps/wave-instance/extra/web_icons:/srv/fluxer-static/web:ro
      - /home/deploy/apps/wave-instance/extra/web_icons/wave-logo-circle.svg:/srv/fluxer-static/fluxer-logo-color.svg:ro
  app-proxy:
    image: wave-app-proxy:larixy
    environment:
      FLUXER_APP_PRODUCT_NAME: "Larixy"
