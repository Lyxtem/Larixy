    deploy:
      resources:
        limits:
          memory: ${LARIXY_MEDIA_PROXY_MEMORY_LIMIT:-1gb}
    environment:
      <<: *larixy-env
      LARIXY_MEDIA_PROXY_PORT: "8080"
