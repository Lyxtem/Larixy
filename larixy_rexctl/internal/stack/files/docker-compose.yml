  TOKIO_WORKER_THREADS: ${LARIXY_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${LARIXY_MALLOC_ARENA_MAX:-2}

x-larixy-logging: &larixy-logging
  driver: json-file
  options:
    max-size: ${LARIXY_LOG_MAX_SIZE:-10m}
    max-file: "${LARIXY_LOG_MAX_FILE:-3}"

x-larixy-service: &larixy-service
  restart: ${LARIXY_RESTART_POLICY:-unless-stopped}
  networks: [ larixy ]
  logging: *larixy-logging

x-larixy-healthcheck: &larixy-healthcheck
  interval: ${LARIXY_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${LARIXY_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${LARIXY_HEALTHCHECK_RETRIES:-10}
  start_period: ${LARIXY_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${LARIXY_HEALTHCHECK_START_INTERVAL:-1s}

x-larixy-app-healthcheck: &larixy-app-healthcheck
  interval: ${LARIXY_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${LARIXY_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${LARIXY_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${LARIXY_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${LARIXY_HEALTHCHECK_START_INTERVAL:-1s}

x-larixy-svc-healthcheck: &larixy-svc-healthcheck
  <<: *larixy-app-healthcheck
  start_period: ${LARIXY_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'" ]

services:
  edge:
    <<: *larixy-service
    image: ${LARIXY_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${LARIXY_EDGE_LISTEN_ADDRESS:+[${LARIXY_EDGE_LISTEN_ADDRESS}]:}${LARIXY_HTTP_PORT:-80}:80"
      - "${LARIXY_EDGE_LISTEN_ADDRESS:+[${LARIXY_EDGE_LISTEN_ADDRESS}]:}${LARIXY_HTTPS_PORT:-443}:443"
      - "${LARIXY_EDGE_LISTEN_ADDRESS:+[${LARIXY_EDGE_LISTEN_ADDRESS}]:}${LARIXY_HTTPS_PORT:-443}:443/udp"
    environment:
      LARIXY_EDGE_SITE_ADDRESS: ${LARIXY_EDGE_SITE_ADDRESS:-${LARIXY_CADDY_SITE_ADDRESS:-${LARIXY_PUBLIC_SCHEME:-https}://${LARIXY_DOMAIN:-}}}
      LARIXY_EDGE_TRUSTED_PROXIES: ${LARIXY_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      LARIXY_EDGE_ENCODE: ${LARIXY_EDGE_ENCODE:-zstd gzip}
      LARIXY_EDGE_PROTOCOLS: ${LARIXY_EDGE_PROTOCOLS:-h1 h2 h3}
      LARIXY_EDGE_GLOBAL_OPTIONS: ${LARIXY_EDGE_GLOBAL_OPTIONS:-}
      LARIXY_EDGE_TLS_DIRECTIVE: ${LARIXY_EDGE_TLS:+tls ${LARIXY_EDGE_TLS:-}}
      LARIXY_ADMIN_BASE_PATH: ${LARIXY_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/" ]
      <<: *larixy-healthcheck
    depends_on:
      api: { condition: service_healthy }
      gateway: { condition: service_healthy }

  postgres:
    <<: *larixy-service
    image: ${LARIXY_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${LARIXY_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres -c max_connections=${LARIXY_POSTGRES_SERVER_MAX_CONNECTIONS:-150} -c shared_buffers=${LARIXY_POSTGRES_SHARED_BUFFERS:-512MB} -c effective_cache_size=${LARIXY_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB} -c work_mem=${LARIXY_POSTGRES_WORK_MEM:-8MB} -c maintenance_work_mem=${LARIXY_POSTGRES_MAINTENANCE_WORK_MEM:-256MB} -c autovacuum_work_mem=${LARIXY_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB} -c random_page_cost=${LARIXY_POSTGRES_RANDOM_PAGE_COST:-1.1} -c effective_io_concurrency=${LARIXY_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200} -c default_statistics_target=${LARIXY_POSTGRES_DEFAULT_STATISTICS_TARGET:-200} -c jit=${LARIXY_POSTGRES_JIT:-off} -c min_wal_size=${LARIXY_POSTGRES_MIN_WAL_SIZE:-80MB} -c max_wal_size=${LARIXY_POSTGRES_MAX_WAL_SIZE:-2GB} -c checkpoint_completion_target=${LARIXY_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9} -c wal_buffers=${LARIXY_POSTGRES_WAL_BUFFERS:-16MB} -c wal_compression=${LARIXY_POSTGRES_WAL_COMPRESSION:-zstd} -c bgwriter_delay=${LARIXY_POSTGRES_BGWRITER_DELAY:-50ms} -c bgwriter_lru_maxpages=${LARIXY_POSTGRES_BGWRITER_LRU_MAXPAGES:-1000} -c autovacuum_vacuum_scale_factor=${LARIXY_POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05} -c autovacuum_analyze_scale_factor=${LARIXY_POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02} -c autovacuum_vacuum_cost_limit=${LARIXY_POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-2000} -c autovacuum_max_workers=${LARIXY_POSTGRES_AUTOVACUUM_MAX_WORKERS:-3} -c max_parallel_workers_per_gather=${LARIXY_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2} -c max_parallel_workers=${LARIXY_POSTGRES_MAX_PARALLEL_WORKERS:-8} -c track_io_timing=${LARIXY_POSTGRES_TRACK_IO_TIMING:-on} -c shared_preload_libraries=${LARIXY_POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}
    shm_size: ${LARIXY_POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_DB: ${LARIXY_POSTGRES_DATABASE:-larixy}
      POSTGRES_USER: ${LARIXY_POSTGRES_USERNAME:-larixy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      <<: *larixy-healthcheck

  valkey:
    <<: *larixy-service
    image: ${LARIXY_VALKEY_IMAGE:-valkey/valkey:9.1-alpine}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_VALKEY_MEMORY_LIMIT:-256mb}
    command: [ "valkey-server", "--appendonly", "yes", "--appendfsync", "${LARIXY_VALKEY_APPENDFSYNC:-everysec}", "--dir", "/data", "--save", "${LARIXY_VALKEY_SAVE:-}", "--maxmemory", "${LARIXY_VALKEY_MAXMEMORY:-192mb}", "--maxmemory-policy", "${LARIXY_VALKEY_MAXMEMORY_POLICY:-noeviction}" ]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      <<: *larixy-healthcheck

  nats:
    <<: *larixy-service
    image: ${LARIXY_NATS_IMAGE:-nats:2.14-alpine}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_NATS_MEMORY_LIMIT:-256mb}
    environment:
      GOMEMLIMIT: ${LARIXY_NATS_GOMEMLIMIT:-200MiB}
      LARIXY_NATS_MAX_MEMORY_STORE: ${LARIXY_NATS_MAX_MEMORY_STORE:-64MB}
      LARIXY_NATS_MAX_FILE_STORE: ${LARIXY_NATS_MAX_FILE_STORE:-10GB}
    command:
      - sh
      - -c
      - >
        printf 'http_port: 8222\njetstream {\n  store_dir: /data\n  max_memory_store: %s\n  max_file_store: %s\n}\n' "$$LARIXY_NATS_MAX_MEMORY_STORE" "$$LARIXY_NATS_MAX_FILE_STORE" > /tmp/nats.conf && exec nats-server -c /tmp/nats.conf
    volumes:
      - nats-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz" ]
      <<: *larixy-healthcheck

  meilisearch:
    <<: *larixy-service
    image: ${LARIXY_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.53}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_MEILISEARCH_MEMORY_LIMIT:-1536mb}
    environment:
      MEILI_ENV: ${LARIXY_MEILISEARCH_ENV:-production}
      MEILI_NO_ANALYTICS: "${LARIXY_MEILISEARCH_NO_ANALYTICS:-true}"
      MEILI_UPGRADE_DB: "true"
      MEILI_MAX_INDEXING_MEMORY: ${LARIXY_MEILISEARCH_MAX_INDEXING_MEMORY:-256mb}
      MEILI_MAX_INDEXING_THREADS: ${LARIXY_MEILISEARCH_MAX_INDEXING_THREADS:-2}
      MEILI_LOG_LEVEL: ${LARIXY_MEILISEARCH_LOG_LEVEL:-WARN}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health" ]
      <<: *larixy-healthcheck

  seaweedfs:
    <<: *larixy-service
    image: ${LARIXY_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.52}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    environment:
      GOMEMLIMIT: ${LARIXY_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: ${LARIXY_SEAWEEDFS_VOLUME_GROWTH:-1}
      WEED_FILER_OPTIONS_MAX_FILE_NAME_LENGTH: "1024"
    command: [ "server", "-s3", "-s3.iam=false", "-dir=/data", "-master.telemetry=${LARIXY_SEAWEEDFS_TELEMETRY:-false}", "-master.volumeSizeLimitMB=${LARIXY_SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}", "-master.garbageThreshold=${LARIXY_SEAWEEDFS_GARBAGE_THRESHOLD:-0.1}", "-volume.max=${LARIXY_SEAWEEDFS_VOLUME_MAX:-10000}", "-s3.concurrentFileUploadLimit=${LARIXY_SEAWEEDFS_S3_CONCURRENT_UPLOADS:-5}" ]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz" ]
      <<: *larixy-healthcheck
      retries: ${LARIXY_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${LARIXY_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${LARIXY_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.52}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [ larixy ]
    logging: *larixy-logging
    depends_on:
      seaweedfs: { condition: service_healthy, restart: true }
    restart: "no"
    environment:
      LARIXY_S3_ACCESS_KEY: ${LARIXY_S3_ACCESS_KEY:-}
      LARIXY_S3_SECRET_KEY: ${LARIXY_S3_SECRET_KEY:-}
      LARIXY_S3_BUCKET_CDN: ${LARIXY_S3_BUCKET_CDN:-larixy}
      LARIXY_S3_BUCKET_UPLOADS: ${LARIXY_S3_BUCKET_UPLOADS:-larixy-uploads}
      LARIXY_S3_BUCKET_REPORTS: ${LARIXY_S3_BUCKET_REPORTS:-larixy-reports}
      LARIXY_S3_BUCKET_HARVESTS: ${LARIXY_S3_BUCKET_HARVESTS:-larixy-harvests}
      LARIXY_SEAWEEDFS_INIT_ATTEMPTS: ${LARIXY_SEAWEEDFS_INIT_ATTEMPTS:-60}
      LARIXY_SEAWEEDFS_UPLOADS_TTL: ${LARIXY_SEAWEEDFS_UPLOADS_TTL:-1d}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$LARIXY_S3_BUCKET_CDN $$LARIXY_S3_BUCKET_UPLOADS $$LARIXY_S3_BUCKET_REPORTS $$LARIXY_S3_BUCKET_HARVESTS"; missing="$$buckets"; for attempt in $$(seq 1 $$LARIXY_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          failure="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if [ "$$LARIXY_SEAWEEDFS_UPLOADS_TTL" = off ]; then
              ttl_rule="fs.configure -locationPrefix=/buckets/$$LARIXY_S3_BUCKET_UPLOADS/ -delete -apply";
            else
              ttl_rule="fs.configure -locationPrefix=/buckets/$$LARIXY_S3_BUCKET_UPLOADS/ -ttl=$$LARIXY_SEAWEEDFS_UPLOADS_TTL -apply";
            fi;
            failure="could not configure the S3 identity";
            if echo "s3.configure -user=larixy -access_key=$$LARIXY_S3_ACCESS_KEY -secret_key=$$LARIXY_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              failure="could not set the expiry of $$LARIXY_S3_BUCKET_UPLOADS";
              if echo "$$ttl_rule" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
                echo "buckets ready";
                exit 0;
              fi;
            fi;
            sleep 2;
            continue;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done; if [ -n "$$failure" ]; then
          echo "seaweedfs-init $$failure" >&2;
        else
          echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        fi; exit 1;

  livekit:
    <<: *larixy-service
    image: ${LARIXY_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_LIVEKIT_MEMORY_LIMIT:-512mb}
    environment:
      GOMEMLIMIT: ${LARIXY_LIVEKIT_GOMEMLIMIT:-435MiB}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${LARIXY_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${LARIXY_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LARIXY_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${LARIXY_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${LARIXY_LIVEKIT_NODE_IP:-}"
          stun_servers:
            - ${LARIXY_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${LARIXY_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${LARIXY_LIVEKIT_TURN_SERVERS:-[]}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:8080/webhooks/livekit
    ports:
      - "${LARIXY_LIVEKIT_TCP_PORT:-7881}:${LARIXY_LIVEKIT_TCP_PORT:-7881}"
      - "${LARIXY_LIVEKIT_UDP_PORT:-7882}:${LARIXY_LIVEKIT_UDP_PORT:-7882}/udp"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/" ]
      <<: *larixy-healthcheck

  api:
    <<: *larixy-service
    image: ${LARIXY_REGISTRY:-ghcr.io/${LARIXY_REGISTRY_OWNER:-Lyxtem}}/larixy-api:${LARIXY_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_API_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${LARIXY_API_MEMORY_RESERVATION:-1gb}
    environment:
      <<: *larixy-env
      LARIXY_API_PORT: "8080"
      LARIXY_SETUP_TOKEN: ${LARIXY_SETUP_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size${LARIXY_API_NODE_HEAP_MB:+=}${LARIXY_API_NODE_HEAP_MB:--percentage=60}${LARIXY_API_NODE_OPTIONS:+ ${LARIXY_API_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${LARIXY_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      LARIXY_POSTGRES_MAX_CONNECTIONS: "${LARIXY_API_POSTGRES_MAX_CONNECTIONS:-25}"
      LARIXY_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "${LARIXY_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED:-true}"
      LARIXY_API_EMBEDDED_WORKER: "${LARIXY_API_EMBEDDED_WORKER:-false}"
      LARIXY_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${LARIXY_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/larixy/ca:ro
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'" ]
      <<: *larixy-app-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
      gifs: { condition: service_healthy }
      snowflakes: { condition: service_healthy }
      messages: { condition: service_healthy }
      users: { condition: service_healthy }

  worker:
    <<: *larixy-service
    image: ${LARIXY_REGISTRY:-ghcr.io/${LARIXY_REGISTRY_OWNER:-Lyxtem}}/larixy-api:${LARIXY_IMAGE_TAG:-v1}
    deploy:
      replicas: ${LARIXY_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${LARIXY_WORKER_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${LARIXY_WORKER_MEMORY_RESERVATION:-1gb}
    command: [ "node", "dist/WorkerEntrypoint.js" ]
    environment:
      <<: *larixy-env
      NODE_OPTIONS: --max-old-space-size${LARIXY_WORKER_NODE_HEAP_MB:+=}${LARIXY_WORKER_NODE_HEAP_MB:--percentage=55}${LARIXY_WORKER_NODE_OPTIONS:+ ${LARIXY_WORKER_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${LARIXY_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      LARIXY_API_WORKER_MODE: all_lanes
      LARIXY_API_WORKER_ENABLE_CRON_SCHEDULER: "true"
      LARIXY_POSTGRES_MAX_CONNECTIONS: "${LARIXY_WORKER_POSTGRES_MAX_CONNECTIONS:-25}"
      LARIXY_WORKER_POSTGRES_SYNCHRONOUS_COMMIT: "${LARIXY_WORKER_POSTGRES_SYNCHRONOUS_COMMIT:-}"
      LARIXY_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${LARIXY_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/larixy/ca:ro
    healthcheck:
      test: [ "CMD-SHELL", "find /tmp/larixy-worker-heartbeat -newermt '-30 seconds' | grep -q ." ]
      <<: *larixy-app-healthcheck
      retries: ${LARIXY_WORKER_HEALTHCHECK_RETRIES:-3}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
      snowflakes: { condition: service_healthy }
      messages: { condition: service_healthy }
      users: { condition: service_healthy }

  gateway:
    <<: *larixy-service
    image: ${LARIXY_REGISTRY:-ghcr.io/${LARIXY_REGISTRY_OWNER:-Lyxtem}}/larixy-gateway:${LARIXY_IMAGE_TAG:-v1}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${LARIXY_GATEWAY_MEMORY_LIMIT:-1gb}
        reservations:
          memory: ${LARIXY_GATEWAY_MEMORY_RESERVATION:-384mb}
    environment:
      <<: *larixy-env
      LARIXY_GATEWAY_PORT: "8080"
      LARIXY_GATEWAY_MEDIA_PROXY_ENDPOINT: ${LARIXY_GATEWAY_MEDIA_PROXY_ENDPOINT:-${LARIXY_MEDIA_ENDPOINT:-${LARIXY_PUBLIC_ORIGIN:-${LARIXY_PUBLIC_SCHEME:-https}://${LARIXY_DOMAIN:-}}/media}}
      LARIXY_GATEWAY_STATIC_CDN_ENDPOINT: ${LARIXY_GATEWAY_STATIC_CDN_ENDPOINT:-${LARIXY_STATIC_CDN_ENDPOINT:-${LARIXY_PUBLIC_ORIGIN:-${LARIXY_PUBLIC_SCHEME:-https}://${LARIXY_DOMAIN:-}}}}
      LARIXY_GATEWAY_LOGGER_LEVEL: ${LARIXY_GATEWAY_LOGGER_LEVEL:-}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-}
      LARIXY_GATEWAY_PUSH_ENABLED: ${LARIXY_GATEWAY_PUSH_ENABLED:-}
      LARIXY_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED: ${LARIXY_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED:-}
      LARIXY_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS: ${LARIXY_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS:-}
      LARIXY_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES: ${LARIXY_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES:-}
      LARIXY_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES: ${LARIXY_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES:-}
      LARIXY_GATEWAY_HTTP_RPC_MAX_CONCURRENCY: ${LARIXY_GATEWAY_HTTP_RPC_MAX_CONCURRENCY:-}
      LARIXY_GATEWAY_NATS_RPC_MAX_HANDLERS: ${LARIXY_GATEWAY_NATS_RPC_MAX_HANDLERS:-}
      LARIXY_GATEWAY_ZSTD_WINDOW_LOG: ${LARIXY_GATEWAY_ZSTD_WINDOW_LOG:-}
      LARIXY_GATEWAY_HTTP_FAILURE_THRESHOLD: ${LARIXY_GATEWAY_HTTP_FAILURE_THRESHOLD:-}
      LARIXY_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS: ${LARIXY_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS:-}
