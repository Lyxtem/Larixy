    <<: *larixy-service
    stop_grace_period: 30s
    image: ${LARIXY_REGISTRY:-ghcr.io/${LARIXY_REGISTRY_OWNER:-Lyxtem}}/larixy-unfurl:${LARIXY_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_UNFURL_MEMORY_LIMIT:-256mb}
