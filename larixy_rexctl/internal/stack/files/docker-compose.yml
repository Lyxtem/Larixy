      LARIXY_STATIC_CDN_ENDPOINT: ${LARIXY_STATIC_CDN_ENDPOINT:-${LARIXY_PUBLIC_ORIGIN:-${LARIXY_PUBLIC_SCHEME:-https}://${LARIXY_DOMAIN:-}}}
      LARIXY_ADMIN_SSO_CLIENT_SECRET: ${LARIXY_ADMIN_SSO_CLIENT_SECRET:-}
      LARIXY_ADMIN_SSO_DISPLAY_NAME: ${LARIXY_ADMIN_SSO_DISPLAY_NAME:-}
      LARIXY_ADMIN_SSO_ONLY: ${LARIXY_ADMIN_SSO_ONLY:-}
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'" ]
      <<: *larixy-app-healthcheck
      start_period: ${LARIXY_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      api: { condition: service_healthy }

networks:
  larixy:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  meilisearch-data:
  seaweedfs-data:
  media-proxy-tmp:
