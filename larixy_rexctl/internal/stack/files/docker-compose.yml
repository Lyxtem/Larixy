    image: ${LARIXY_REGISTRY:-ghcr.io/${LARIXY_REGISTRY_OWNER:-Lyxtem}}/larixy-app-proxy-self-hosted:${LARIXY_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${LARIXY_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      RUST_LOG: ${RUST_LOG:-}
      TOKIO_WORKER_THREADS: ${LARIXY_TOKIO_WORKER_THREADS:-2}
      LARIXY_APP_PROXY_PORT: "8080"
      LARIXY_S3_PUBLIC_ENDPOINT: ${LARIXY_S3_PUBLIC_ENDPOINT:-}
