      LARIXY_SVC_NAME: unfurl
      LARIXY_SVC_MODE: combined
      LARIXY_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
      LARIXY_ACTIVITYPUB_SIGNING_KEY_BASE64: ${LARIXY_ACTIVITYPUB_SIGNING_KEY_BASE64:-}
