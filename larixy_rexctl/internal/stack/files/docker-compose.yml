      LARIXY_CSP_EXTRA_WORKER_SRC: ${LARIXY_CSP_EXTRA_WORKER_SRC:-}
      LARIXY_CSP_EXTRA_MANIFEST_SRC: ${LARIXY_CSP_EXTRA_MANIFEST_SRC:-}
      LARIXY_CSP_REPORT_URI: ${LARIXY_CSP_REPORT_URI:-}
