      LARIXY_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS: ${LARIXY_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS:-}
      LARIXY_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES: ${LARIXY_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES:-}
      LARIXY_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES: ${LARIXY_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES:-}
      LARIXY_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR: ${LARIXY_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR:-}
