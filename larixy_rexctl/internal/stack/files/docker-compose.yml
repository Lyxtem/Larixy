      LARIXY_S3_READ_SIGNED: "${LARIXY_S3_READ_SIGNED:-true}"
    volumes:
      - media-proxy-tmp:/tmp
    healthcheck:
      test: [ "CMD", "/usr/local/bin/larixy-media-proxy", "healthcheck" ]
      <<: *larixy-healthcheck
      interval: ${LARIXY_MEDIA_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      seaweedfs-init: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

