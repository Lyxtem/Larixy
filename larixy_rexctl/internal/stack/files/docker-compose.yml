    environment:
      <<: *larixy-rust-env
      LARIXY_PUSH_SERVICE_QUEUE_CAPACITY: ${LARIXY_PUSH_SERVICE_QUEUE_CAPACITY:-}
      LARIXY_PUSH_SERVICE_SEND_CONCURRENCY: ${LARIXY_PUSH_SERVICE_SEND_CONCURRENCY:-}
      LARIXY_PUSH_SERVICE_APNS_BASE_URL: ${LARIXY_PUSH_SERVICE_APNS_BASE_URL:-}
      LARIXY_PUSH_SERVICE_FCM_BASE_URL: ${LARIXY_PUSH_SERVICE_FCM_BASE_URL:-}
      LARIXY_PUSH_SERVICE_MANAGED_RELAY_HOSTS: ${LARIXY_PUSH_SERVICE_MANAGED_RELAY_HOSTS:-}
