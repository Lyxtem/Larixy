    healthcheck:
      test: [ "CMD", "/usr/local/bin/larixy-push", "healthcheck" ]
      <<: *larixy-app-healthcheck
      start_period: ${LARIXY_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      nats: { condition: service_healthy }
      api: { condition: service_healthy }

