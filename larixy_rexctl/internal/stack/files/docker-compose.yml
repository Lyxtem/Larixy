      LARIXY_APP_PROXY_INDEX_UPSTREAM_URL: ${LARIXY_APP_PROXY_INDEX_UPSTREAM_URL:-}
      LARIXY_APP_PROXY_SAME_ORIGIN_HOSTS: ${LARIXY_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      LARIXY_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${LARIXY_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      LARIXY_LIVEKIT_URL: ${LARIXY_LIVEKIT_URL:-}
      LARIXY_CSP_EXTRA_DEFAULT_SRC: ${LARIXY_CSP_EXTRA_DEFAULT_SRC:-}
      LARIXY_CSP_EXTRA_CONNECT_SRC: ${LARIXY_CSP_EXTRA_CONNECT_SRC:-}
      LARIXY_CSP_EXTRA_IMG_SRC: ${LARIXY_CSP_EXTRA_IMG_SRC:-}
      LARIXY_CSP_EXTRA_MEDIA_SRC: ${LARIXY_CSP_EXTRA_MEDIA_SRC:-}
