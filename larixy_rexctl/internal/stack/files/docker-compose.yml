      LARIXY_MEDIA_PROXY_MAX_ENCODE_DURATION_MS: ${LARIXY_MEDIA_PROXY_MAX_ENCODE_DURATION_MS:-}
      LARIXY_MEDIA_PROXY_MAX_ENCODE_FRAMES: ${LARIXY_MEDIA_PROXY_MAX_ENCODE_FRAMES:-}
      LARIXY_MEDIA_PROXY_TRANSFORM_TIMEOUT_MS: ${LARIXY_MEDIA_PROXY_TRANSFORM_TIMEOUT_MS:-}
      LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_BYTES: ${LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_BYTES:-}
      LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_MAX_ENTRY_BYTES: ${LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_MAX_ENTRY_BYTES:-}
      LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS: ${LARIXY_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS:-}
