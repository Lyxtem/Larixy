      LARIXY_S3_SESSION_TOKEN: ${LARIXY_S3_SESSION_TOKEN:-}
      LARIXY_S3_READ_ENDPOINT: ${LARIXY_S3_READ_ENDPOINT:-}
      LARIXY_S3_READ_BUCKET: ${LARIXY_S3_READ_BUCKET:-}
