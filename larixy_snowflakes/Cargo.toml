[package]
name = "larixy-snowflakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
larixy_common = { path = "../larixy_common" }
larixy-svc = { path = "../larixy_svc", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
larixy-svc = { path = "../larixy_svc", default-features = false, features = ["mock"] }
